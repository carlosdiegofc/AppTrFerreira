<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10233d">
<title>Panel del dueño · TR Ferreira</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
:root{--navy:#10233d;--blue:#1c64f2;--muted:#637388;--pale:#f1f6fc;--card:#fff;--ok:#0c775a;--warn:#c27a10;--bad:#b62f34;--line:#dde6f2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pale);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:1100}
header img{height:26px}
header .tag{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--muted);white-space:nowrap}
@media(max-width:520px){header .tag{display:none}}
header .grow{flex:1}
header .who{font-size:13px;color:var(--muted);display:none}
button,select{font:inherit}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:linear-gradient(135deg,var(--blue),#4a86f6);color:#fff;cursor:pointer;min-height:44px}
.btn.sec{background:#e7effd;color:var(--blue)}
.btn.small{padding:6px 12px;min-height:36px;font-size:14px}
nav{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;background:var(--pale);position:sticky;top:47px;z-index:1000}
nav button{border:0;background:#fff;color:var(--muted);border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap;min-height:44px;box-shadow:0 1px 2px rgba(16,35,61,.08)}
nav button.on{background:var(--navy);color:#fff}
main{padding:0 16px 32px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 1px 4px rgba(16,35,61,.1)}
h1{font-size:26px;margin:18px 0 4px}
h2{font-size:18px;margin:0 0 6px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
#map,#routeMap{height:60vh;min-height:340px;border-radius:20px;margin-top:12px;overflow:hidden;z-index:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.ok{background:var(--ok)}.warn{background:var(--warn)}.off{background:#98a3b3}.bad{background:var(--bad)}
.banner{background:#fff4e0;border:1px solid #f1d29b;color:#7a4b06;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.banner.err{background:#fdecec;border-color:#f3b9bb;color:#7d1d21}
.kpi{font-size:30px;font-weight:800}
.grid.kpis{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--pale)}
select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:44px}
.login{max-width:420px;margin:8vh auto 0}
.login img{height:44px;display:block;margin:0 auto 12px}
dialog{border:0;border-radius:20px;padding:0;width:min(900px,96vw);max-height:92vh}
dialog::backdrop{background:rgba(16,35,61,.55)}
.dlg{padding:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.hidden{display:none!important}
@media(min-width:700px){header .who{display:block}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="TR Ferreira">
  <span class="tag">PANEL DEL DUEÑO</span>
  <span class="grow"></span>
  <span class="who" id="who"></span>
  <button class="btn sec small hidden" id="logout">Salir</button>
</header>

<section id="loginView" class="login card">
  <img src="logo.png" alt="TR Ferreira">
  <h2>Ingresá con tu cuenta</h2>
  <p class="muted">Usá el correo de dueño. Los permisos los define Supabase, no esta página.</p>
  <form id="loginForm">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" required>
    <p class="muted" id="loginMsg" role="status"></p>
    <button class="btn" style="width:100%" type="submit">Ingresar</button>
  </form>
</section>

<div id="appView" class="hidden">
  <nav id="tabs">
    <button data-tab="fleet" class="on">Flota en vivo</button>
    <button data-tab="trips">Viajes</button>
    <button data-tab="fuel">Combustible</button>
    <button data-tab="summary">Resumen</button>
  </nav>
  <main>
    <section id="fleet">
      <h1>Flota en vivo</h1>
      <p class="muted" id="fleetInfo">Cargando…</p>
      <div id="fleetBanner"></div>
      <div id="map"></div>
      <div class="row" style="margin-top:12px">
        <select id="mapStyle" aria-label="Vista del mapa"><option value="streets">Rutas y ciudades</option><option value="satellite">Satélite</option></select>
        <button class="btn sec small" id="fitAll">Ver toda la flota</button>
        <span class="muted">Se actualiza cada 15 s</span>
      </div>
      <div class="grid" id="fleetList"></div>
    </section>

    <section id="trips" class="hidden">
      <h1>Viajes</h1>
      <div class="row">
        <select id="tripVehicle" aria-label="Camión"><option value="">Todos los camiones</option></select>
        <select id="tripDriver" aria-label="Chofer"><option value="">Todos los choferes</option></select>
      </div>
      <div id="tripBanner"></div>
      <div class="grid" id="tripList"></div>
    </section>

    <section id="fuel" class="hidden">
      <h1>Combustible</h1>
      <div class="row">
        <select id="fuelVehicle" aria-label="Camión"><option value="">Todos los camiones</option></select>
      </div>
      <div id="fuelBanner"></div>
      <div class="card scroll"><table id="fuelTable"></table></div>
    </section>

    <section id="summary" class="hidden">
      <h1>Resumen del mes</h1>
      <p class="muted" id="summaryInfo"></p>
      <div id="summaryBanner"></div>
      <div class="grid kpis" id="summaryKpis"></div>
      <div class="card scroll"><table id="summaryTable"></table></div>
    </section>
  </main>
</div>

<dialog id="routeDlg"><div class="dlg">
  <div class="row"><h2 id="routeTitle" style="flex:1"></h2><button class="btn sec small" id="routeClose">Cerrar</button></div>
  <p class="muted" id="routeInfo"></p>
  <div id="routeMap"></div>
</div></dialog>

<script src="vendor/leaflet.js"></script>
<script>
(function(){
'use strict';
const SUPABASE_URL='https://jpwtsffatezwnfhunqrz.supabase.co';
const SUPABASE_KEY='sb_publishable_rR1oVw4W6qr4ktMqfiN2zg_kxgt-eV8';
const STALE_MS=5*60*1000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,d=1)=>Number(v).toLocaleString('es-UY',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtDate=s=>{const d=new Date(s);return isNaN(d)?'—':d.toLocaleString('es-UY',{dateStyle:'short',timeStyle:'short'})};
const ago=ms=>{const m=Math.round(ms/60000);if(m<1)return 'hace instantes';if(m<60)return 'hace '+m+' min';const h=Math.round(m/60);return h<48?'hace '+h+' h':'hace '+Math.round(h/24)+' días'};

let session=null;
try{session=JSON.parse(localStorage.getItem('trf-owner-session')||'null')}catch(_){}
function saveSession(s){session=s;try{s?localStorage.setItem('trf-owner-session',JSON.stringify(s)):localStorage.removeItem('trf-owner-session')}catch(_){}}

async function raw(path,opts,token){
  const h=Object.assign({apikey:SUPABASE_KEY},(opts&&opts.headers)||{});
  if(token)h.Authorization='Bearer '+token;
  const r=await fetch(SUPABASE_URL+path,Object.assign({},opts,{headers:h}));
  const t=await r.text();
  if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;e.body=t;throw e}
  return t?JSON.parse(t):null;
}
async function refresh(){
  if(!session||!session.refresh_token)throw Object.assign(new Error('sin sesión'),{status:401});
  const s=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  saveSession(s);
}
async function api(path){
  if(!session)throw Object.assign(new Error('sin sesión'),{status:401});
  if((session.expires_at||0)<Date.now()/1000+60)await refresh();
  try{return await raw('/rest/v1/'+path,{},session.access_token)}
  catch(e){if(e.status===401){await refresh();return raw('/rest/v1/'+path,{},session.access_token)}throw e}
}
async function pages(path,max){
  const out=[];const size=1000;
  for(let off=0;off<max;off+=size){const p=await api(path+'&limit='+Math.min(size,max-off)+'&offset='+off);out.push(...p);if(p.length<size)break}
  return out;
}
function banner(id,msg,err){$(id).innerHTML=msg?'<div class="banner'+(err?' err':'')+'">'+msg+'</div>':''}
function explain(e){
  if(e&&e.status===401)return 'La sesión venció. Salí y volvé a ingresar.';
  if(e&&e.status===403)return 'Supabase no permite leer estos datos con tu cuenta (falta una política de acceso para dueños).';
  return 'No se pudieron cargar los datos ('+esc(e&&e.message||'error')+'). Revisá la conexión.';
}

/* ---------- login ---------- */
$('loginForm').addEventListener('submit',async ev=>{
  ev.preventDefault();$('loginMsg').textContent='Ingresando…';
  try{
    const s=await raw('/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim().toLowerCase(),password:$('pass').value})});
    $('pass').value='';saveSession(s);start();
  }catch(e){$('loginMsg').textContent='No se pudo ingresar. Revisá tus datos y la conexión.'}
});
$('logout').addEventListener('click',()=>{saveSession(null);location.reload()});

/* ---------- tabs ---------- */
let current='fleet';
function show(tab){
  current=tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  ['fleet','trips','fuel','summary'].forEach(t=>$(t).classList.toggle('hidden',t!==tab));
  if(tab==='fleet'){setTimeout(()=>{ensureMap();map.invalidateSize();loadFleet()},0)}
  if(tab==='trips')loadTrips();
  if(tab==='fuel')loadFuel();
  if(tab==='summary')loadSummary();
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab)});

/* ---------- maps ---------- */
const TILES={streets:['https://tile.openstreetmap.org/{z}/{x}/{y}.png','© OpenStreetMap contributors'],satellite:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Tiles © Esri']};
function baseLayer(style){return L.tileLayer(TILES[style][0],{maxZoom:19,attribution:TILES[style][1]})}
let map=null,baseL=null,markers=[];
function ensureMap(){
  if(map)return;
  map=L.map('map').setView([-32.8,-56],6);
  baseL=baseLayer('streets').addTo(map);
  $('mapStyle').addEventListener('change',()=>{map.removeLayer(baseL);baseL=baseLayer($('mapStyle').value).addTo(map);baseL.bringToBack()});
  $('fitAll').addEventListener('click',fitFleet);
}
function status(r){
  const age=Date.now()-new Date(r.updated_at||r.recorded_at).getTime();
  if(!r.is_tracking)return {cls:'off',txt:'Sin viaje activo',color:'#98a3b3'};
  if(age>STALE_MS)return {cls:'warn',txt:'Sin señal '+ago(age),color:'#c27a10'};
  return {cls:'ok',txt:'En viaje · '+ago(age),color:'#0c775a'};
}
let fleetRows=[];
function fitFleet(){
  const pts=fleetRows.filter(r=>isFinite(r.latitude)&&isFinite(r.longitude)).map(r=>[r.latitude,r.longitude]);
  if(pts.length)map.fitBounds(pts,{padding:[40,40],maxZoom:14});
}
let firstFleet=true;
async function loadFleet(){
  try{
    fleetRows=await api('trf_driver_locations?select=*&order=updated_at.desc');
    banner('fleetBanner','');renderFleet();
  }catch(e){banner('fleetBanner',explain(e),true);$('fleetInfo').textContent=''}
}
function renderFleet(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const me=session&&session.user&&session.user.id;
  const rows=fleetRows.filter(r=>isFinite(r.latitude)&&isFinite(r.longitude));
  rows.forEach(r=>{
    const s=status(r);
    const m=L.circleMarker([r.latitude,r.longitude],{radius:11,color:'#fff',weight:3,fillColor:s.color,fillOpacity:1}).addTo(map);
    m.bindTooltip(esc(r.vehicle||'Sin camión')+' · '+esc(r.driver_name||''),{direction:'top',offset:[0,-8]});
    m.bindPopup('<strong>'+esc(r.vehicle||'Sin camión')+'</strong><br>'+esc(r.driver_name||'')+'<br>'+(r.speed_kmh!=null?num(r.speed_kmh,0)+' km/h<br>':'')+esc(s.txt));
    markers.push(m);
  });
  const active=rows.filter(r=>status(r).cls==='ok').length;
  $('fleetInfo').textContent=rows.length+' camión(es) con ubicación · '+active+' en viaje con señal reciente';
  $('fleetList').innerHTML=rows.map(r=>{const s=status(r);return '<div class="card"><div><span class="dot '+s.cls+'"></span><strong>'+esc(r.vehicle||'Sin camión')+'</strong></div><div class="muted">'+esc(r.driver_name||'—')+'</div><div style="margin-top:6px">'+(r.speed_kmh!=null&&s.cls==='ok'?'<span class="kpi" style="font-size:22px">'+num(r.speed_kmh,0)+'</span> km/h · ':'')+'<span class="muted">'+esc(s.txt)+'</span></div></div>'}).join('');
  if(rows.length<=1&&me&&rows.every(r=>r.driver_id===me))banner('fleetBanner','Solo se ve tu propia ubicación. Si esperabas ver más camiones, falta darle permiso de lectura a tu cuenta en Supabase (ver <code>SUPABASE-PERMISOS.sql</code>).');
  if(firstFleet&&rows.length){firstFleet=false;fitFleet()}
}
setInterval(()=>{if(session&&current==='fleet'&&!document.hidden)loadFleet()},15000);

/* ---------- trips ---------- */
let trips=[],fuel=[];
function fillSelect(el,values,first){const cur=el.value;el.innerHTML='<option value="">'+first+'</option>'+[...new Set(values.filter(Boolean))].sort().map(v=>'<option>'+esc(v)+'</option>').join('');el.value=cur}
async function ensureTrips(){if(!trips.length)trips=await pages('trf_driver_tracking_sessions?select=*&order=started_at.desc',500);return trips}
async function ensureFuel(){if(!fuel.length)fuel=await pages('trf_driver_fuel_receipts?select=*&archived=eq.false&order=recorded_at.desc',500);return fuel}
async function loadTrips(){
  try{
    await ensureTrips();banner('tripBanner','');
    fillSelect($('tripVehicle'),trips.map(t=>t.vehicle),'Todos los camiones');
    fillSelect($('tripDriver'),trips.map(t=>t.driver_name),'Todos los choferes');
    renderTrips();
  }catch(e){banner('tripBanner',explain(e),true)}
}
function renderTrips(){
  const v=$('tripVehicle').value,d=$('tripDriver').value;
  const rows=trips.filter(t=>(!v||t.vehicle===v)&&(!d||t.driver_name===d));
  $('tripList').innerHTML=rows.length?rows.map(t=>{
    const st=t.active?(t.paused?'Pausado':'En curso'):'Finalizado';
    return '<div class="card"><strong>'+esc(t.vehicle||'Sin camión')+'</strong><div class="muted">'+esc(t.driver_name||'—')+' · '+fmtDate(t.started_at)+'</div><div style="margin:6px 0"><span class="kpi" style="font-size:24px">'+num((t.distance_meters||0)/1000)+'</span> km · '+st+(t.load_type==='empty'?' · Retorno vacío':'')+'</div><button class="btn sec small" data-trip="'+esc(t.id)+'">Ver recorrido</button></div>';
  }).join(''):'<p class="muted">No hay viajes para mostrar.</p>';
}
$('tripVehicle').addEventListener('change',renderTrips);
$('tripDriver').addEventListener('change',renderTrips);
$('tripList').addEventListener('click',e=>{const b=e.target.closest('button[data-trip]');if(b)openRoute(trips.find(t=>t.id===b.dataset.trip))});

let rmap=null,rbase=null,rlayers=[];
async function openRoute(t){
  if(!t)return;
  $('routeTitle').textContent=(t.vehicle||'Sin camión')+' · '+fmtDate(t.started_at);
  $('routeInfo').textContent='Cargando recorrido…';
  $('routeDlg').showModal();
  if(!rmap){rmap=L.map('routeMap').setView([-32.8,-56],6);rbase=baseLayer('streets').addTo(rmap)}
  setTimeout(()=>rmap.invalidateSize(),50);
  rlayers.forEach(l=>rmap.removeLayer(l));rlayers=[];
  try{
    let q='trf_driver_location_history?select=latitude,longitude,recorded_at,segment&driver_id=eq.'+encodeURIComponent(t.driver_id)+'&recorded_at=gte.'+encodeURIComponent(t.started_at)+(t.ended_at?'&recorded_at=lte.'+encodeURIComponent(t.ended_at):'')+'&vehicle=eq.'+encodeURIComponent(t.vehicle||'')+'&order=recorded_at.asc,id.asc';
    const pts=await pages(q,20000);
    if(!pts.length){$('routeInfo').textContent='Este viaje no tiene recorrido guardado en el servidor (puede estar pendiente de envío).';return}
    let seg=[],prev=null;const draw=()=>{if(seg.length>1)rlayers.push(L.polyline(seg,{color:'#1c64f2',weight:4}).addTo(rmap));seg=[]};
    pts.forEach(p=>{if(prev&&(p.segment!==prev.segment||Date.parse(p.recorded_at)-Date.parse(prev.recorded_at)>90000))draw();seg.push([p.latitude,p.longitude]);prev=p});draw();
    const a=pts[0],z=pts[pts.length-1];
    rlayers.push(L.circleMarker([a.latitude,a.longitude],{radius:8,color:'#0c775a',fillColor:'#0c775a',fillOpacity:1}).bindTooltip('Inicio').addTo(rmap));
    rlayers.push(L.circleMarker([z.latitude,z.longitude],{radius:8,color:'#b62f34',fillColor:'#b62f34',fillOpacity:1}).bindTooltip('Última ubicación').addTo(rmap));
    rmap.fitBounds(pts.map(p=>[p.latitude,p.longitude]),{padding:[30,30],maxZoom:15});
    $('routeInfo').textContent=pts.length+' lecturas GPS · '+num((t.distance_meters||0)/1000)+' km';
  }catch(e){$('routeInfo').textContent=explain(e)}
}
$('routeClose').addEventListener('click',()=>$('routeDlg').close());

/* ---------- fuel ---------- */
const pick=(row,k1,k2)=>{const d=row.panel_data||{};const v=d[k1];return v!=null&&v!==''?v:row[k2]};
async function loadFuel(){
  try{
    await ensureFuel();banner('fuelBanner','');
    fillSelect($('fuelVehicle'),fuel.map(f=>pick(f,'vehicle','vehicle')),'Todos los camiones');
    renderFuel();
  }catch(e){banner('fuelBanner',explain(e),true)}
}
function renderFuel(){
  const v=$('fuelVehicle').value;
  const rows=fuel.filter(f=>!v||pick(f,'vehicle','vehicle')===v);
  $('fuelTable').innerHTML='<thead><tr><th>Fecha</th><th>Camión</th><th>Chofer</th><th>Estación</th><th class="n">Litros</th><th class="n">Total</th></tr></thead><tbody>'+
    (rows.length?rows.map(f=>'<tr><td>'+esc(pick(f,'fecha','receipt_date')||fmtDate(f.recorded_at))+'</td><td>'+esc(pick(f,'vehicle','vehicle')||'—')+'</td><td>'+esc(f.driver_name||'—')+'</td><td>'+esc(pick(f,'estacionNombre','station_name')||'Por completar')+'</td><td class="n">'+(pick(f,'litros','liters')!=null?num(pick(f,'litros','liters')):'—')+'</td><td class="n">'+(pick(f,'monto','total')!=null?num(pick(f,'monto','total'),0):'—')+'</td></tr>').join(''):'<tr><td colspan="6" class="muted">No hay cargas para mostrar.</td></tr>')+'</tbody>';
}
$('fuelVehicle').addEventListener('change',renderFuel);

/* ---------- summary ---------- */
async function loadSummary(){
  try{
    await Promise.all([ensureTrips(),ensureFuel()]);banner('summaryBanner','');
    const now=new Date(),y=now.getFullYear(),m=now.getMonth();
    const inMonth=s=>{const d=new Date(s);return d.getFullYear()===y&&d.getMonth()===m};
    const per={};
    const row=v=>per[v||'Sin camión']||(per[v||'Sin camión']={km:0,trips:0,liters:0,total:0});
    trips.filter(t=>inMonth(t.started_at)).forEach(t=>{const r=row(t.vehicle);r.km+=(t.distance_meters||0)/1000;r.trips++});
    fuel.filter(f=>inMonth(f.recorded_at)).forEach(f=>{const r=row(pick(f,'vehicle','vehicle'));r.liters+=Number(pick(f,'litros','liters'))||0;r.total+=Number(pick(f,'monto','total'))||0});
    const names=Object.keys(per).sort();
    const sum=k=>names.reduce((a,n)=>a+per[n][k],0);
    $('summaryInfo').textContent=now.toLocaleString('es-UY',{month:'long',year:'numeric'})+' · calculado con los últimos registros cargados (hasta 500).';
    $('summaryKpis').innerHTML=[['Kilómetros GPS',num(sum('km'),0)],['Viajes',num(sum('trips'),0)],['Litros',num(sum('liters'),0)],['Gasto combustible',num(sum('total'),0)]].map(k=>'<div class="card"><div class="muted">'+k[0]+'</div><div class="kpi">'+k[1]+'</div></div>').join('');
    $('summaryTable').innerHTML='<thead><tr><th>Camión</th><th class="n">Viajes</th><th class="n">Km</th><th class="n">Litros</th><th class="n">Gasto</th><th class="n">L/100 km</th></tr></thead><tbody>'+
      (names.length?names.map(n=>{const r=per[n];return '<tr><td>'+esc(n)+'</td><td class="n">'+r.trips+'</td><td class="n">'+num(r.km,0)+'</td><td class="n">'+num(r.liters,0)+'</td><td class="n">'+num(r.total,0)+'</td><td class="n">'+(r.km>50&&r.liters>0?num(r.liters/r.km*100):'—')+'</td></tr>'}).join(''):'<tr><td colspan="6" class="muted">Sin registros este mes.</td></tr>')+'</tbody>';
  }catch(e){banner('summaryBanner',explain(e),true)}
}

/* ---------- start ---------- */
function start(){
  $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('logout').classList.remove('hidden');
  $('who').textContent=(session.user&&session.user.email)||'';
  trips=[];fuel=[];firstFleet=true;show('fleet');
}
if(session)start();
})();
</script>
