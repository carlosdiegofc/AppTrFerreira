android.useAndroidX=true
kotlin.code.style=official
# The release build compiles every source again in the same Kotlin daemon after the debug one: with Gradle's default
# 512 MB it ran out of memory in CI (28/10/2026). The CI machine has 16 GB.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
