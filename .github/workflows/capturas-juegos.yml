name: Capturas de los juegos
# Temporal: arma la versión de prueba, juega en un emulador y deja las capturas 20 minutos en la rama
# tmp/capturas-juegos para revisarlas fuera de GitHub. Se borra antes de unir la rama.
on:
  push:
    branches: [claude/apptrferreira-g1agmt]
    paths: ['.github/workflows/capturas-juegos.yml', '.github/scripts/probar_juegos.py', 'app/**']
permissions:
  contents: write
concurrency:
  group: capturas-juegos
  cancel-in-progress: true
jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Habilitar la aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 127.0.0.1
          script: python3 .github/scripts/probar_juegos.py app/build/outputs/apk/debug/app-debug.apk capturas
      - name: Dejar las capturas en tmp/capturas-juegos
        shell: bash
        run: |
          cd capturas
          if [ -f logcat.txt ]; then grep -E " (E|W|F) " logcat.txt | tail -400 > logcat-errores.txt || true; rm logcat.txt; fi
          ls -la
          git init -q -b tmp
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "Capturas $GITHUB_SHA"
          git push -q --force "$REMOTE" tmp:refs/heads/tmp/capturas-juegos
      - name: Esperar 20 minutos
        run: sleep 1200
      - name: Borrar la rama temporal
        if: always()
        run: git push -q "$REMOTE" --delete tmp/capturas-juegos || true
