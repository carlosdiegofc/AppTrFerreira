name: Publicar panel web
# Solo se ejecuta a mano (Actions → Publicar panel web → Run workflow).
# Requiere Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - name: Panel nuevo
        working-directory: panel
        # La clave de Google Maps de la vista satelital (README del panel); sin ella los mapas quedan solo con calles.
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          npm ci
          npm run build
      - name: Archivos de la web (sin pruebas ni SQL)
        run: |
          # El panel nuevo va en la dirección principal y el anterior queda en /anterior/ un tiempo (decisión del
          # 26/10/2026). /nuevo/ (panel/public/nuevo) lleva a la principal, para que no se rompan los enlaces guardados.
          mkdir -p _site/anterior
          cp -r panel/dist/. _site/
          cp -r web/index.html web/css web/js web/vendor web/logo.png _site/anterior/
          test -f _site/index.html && test -f _site/nuevo/index.html && test -f _site/anterior/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
