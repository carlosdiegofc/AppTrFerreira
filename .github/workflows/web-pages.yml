name: Publicar panel web
# Solo se ejecuta a mano (Actions → Publicar panel web → Run workflow).
# Requiere Settings → Pages → Source: GitHub Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Archivos de la web (sin pruebas ni SQL)
        run: |
          mkdir _site
          cp -r web/index.html web/css web/js web/vendor web/logo.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
