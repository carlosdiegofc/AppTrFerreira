name: Probar panel nuevo y base
on:
  push:
    paths: ['panel/**', 'supabase/**', '.github/workflows/panel-tests.yml']
  pull_request:
    paths: ['panel/**', 'supabase/**', '.github/workflows/panel-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same major version as the Supabase project.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      AUTHENTICATOR_PASSWORD: test
      POSTGREST_URL: http://127.0.0.1:3301
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: panel/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas de reglas
        run: npm test
      - name: Compilar para producción
        run: npm run build
      - name: Base de prueba con todas las migraciones y permisos
        run: |
          bash tests/e2e/db/reset.sh
          psql -X -q -v ON_ERROR_STOP=1 -d panel_e2e -f tests/e2e/db/permissions.sql
          psql -X -q -v ON_ERROR_STOP=1 -d panel_e2e -f tests/e2e/db/road.sql
          psql -X -q -v ON_ERROR_STOP=1 -d panel_e2e -f tests/e2e/db/drivers.sql
      - name: PostgREST (la misma API que usa Supabase)
        run: |
          curl -sSL -o "$RUNNER_TEMP/postgrest.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP"
          printf '%s\n' 'db-uri = "postgres://authenticator:test@localhost:5432/panel_e2e"' 'db-schemas = "public"' 'db-anon-role = "anon"' \
            'jwt-secret = "local-test-secret-for-trf-panel-0123456789"' 'server-host = "127.0.0.1"' 'server-port = 3301' > "$RUNNER_TEMP/postgrest.conf"
          nohup "$RUNNER_TEMP/postgrest" "$RUNNER_TEMP/postgrest.conf" > "$RUNNER_TEMP/postgrest.log" 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:3301/ && break; sleep 1; done
      - name: Navegador
        run: npx playwright install --with-deps chromium
      - name: Prueba de punta a punta
        run: npm run e2e
        env:
          CI: '1'
      - name: Capturas de pantalla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-panel-nuevo
          path: panel/tests/e2e/shots
          if-no-files-found: ignore
      - name: Registro de PostgREST
        if: failure()
        run: cat "$RUNNER_TEMP/postgrest.log" || true
