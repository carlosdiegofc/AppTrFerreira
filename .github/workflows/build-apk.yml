name: Crear APK de Android
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión real del código
        id: version
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          content = Path("app/build.gradle.kts").read_text()
          match = re.search(r'versionName\s*=\s*"([0-9.]+)"', content)
          if not match:
              raise SystemExit("No se encontró la versión de app/build.gradle.kts")
          version = match.group(1)
          print("Compilando versión " + version)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("name=" + version + "\n")
          PYCODE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Preparar la llave de subida a Google Play
        env:
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        shell: bash
        run: |
          key="$RUNNER_TEMP/upload.p12"
          if [ -n "$UPLOAD_KEYSTORE" ]; then
            printf '%s' "$UPLOAD_KEYSTORE" | base64 --decode --ignore-garbage > "$key"
            password="$UPLOAD_PASSWORD"
          else
            # Sin los secretos se firma con una llave descartable, solo para comprobar que el paquete de Google Play compila.
            password="prueba-$GITHUB_RUN_ID"
            keytool -genkeypair -keystore "$key" -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Prueba" -storepass "$password" -keypass "$password"
          fi
          echo "TRF_UPLOAD_KEYSTORE=$key" >> "$GITHUB_ENV"
          echo "TRF_UPLOAD_PASSWORD=$password" >> "$GITHUB_ENV"
      # La versión release (el .aab y su APK) sale optimizada y ofuscada por R8; las dos llevan el mismo código.
      # La clave del mapa de Google para Android entra al compilar (docs/GOOGLE-MAPS.md); sin ella la app usa su mapa de siempre.
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:bundleRelease :app:assembleRelease
        env:
          GOOGLE_MAPS_ANDROID_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_KEY }}
      - name: Borrar la llave del equipo de compilación
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: Transportes-Ferreira-GPS-v${{ steps.version.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: Google-Play-Transportes-Ferreira-GPS-v${{ steps.version.outputs.name }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: version-optimizada-para-probar
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          if-no-files-found: error
  probar:
    name: Probar la versión optimizada en un emulador
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: version-optimizada-para-probar
          path: apk-a-probar
      # Los juegos se abren sin cuenta solo en la versión de prueba, que nunca va a Google Play.
      - uses: actions/download-artifact@v4
        with:
          name: Transportes-Ferreira-GPS-v${{ needs.build.outputs.version }}
          path: apk-de-prueba
      - name: Habilitar la aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Sin DNS (-dns-server 127.0.0.1): la prueba nunca llega a la base real. Después de la versión optimizada, los juegos
      # con la versión de prueba.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 127.0.0.1
          script: |
            python3 .github/scripts/probar_app_optimizada.py apk-a-probar/app-release.apk prueba-version-optimizada
            python3 .github/scripts/probar_juegos.py apk-de-prueba/app-debug.apk prueba-juegos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-version-optimizada
          path: prueba-version-optimizada
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-juegos
          path: prueba-juegos
          retention-days: 14
          if-no-files-found: ignore
